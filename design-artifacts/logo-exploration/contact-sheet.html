<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aether Logo Exploration</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #08090d;
        color: #f7f8ff;
      }

      body {
        margin: 0;
        padding: 40px;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 6px 0 0;
        max-width: 640px;
        color: #a9afc2;
        line-height: 1.5;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      figure {
        margin: 0;
        padding: 18px;
        border: 1px solid #242838;
        border-radius: 8px;
        background: #10131d;
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 28px;
        background: #fff;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        color: #d9def0;
        font-size: 13px;
      }

      code {
        color: #83d8ff;
      }

      @media (max-width: 840px) {
        body {
          padding: 20px;
        }

        header {
          display: block;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Aether logo exploration</h1>
          <p>Hand-built vector marks, designed as app-icon foreground candidates. No generative textures, no fake detail.</p>
        </div>
      </header>

      <section class="grid" aria-label="Aether logo concepts">
        <figure>
          <img src="aether-mark-01-ribbon-core.svg" alt="Aether mark 01" />
          <figcaption><span>01 Ribbon Core</span><code>closest to current</code></figcaption>
        </figure>
        <figure>
          <img src="aether-mark-02-aperture.svg" alt="Aether mark 02" />
          <figcaption><span>02 Aperture</span><code>cleanest silhouette</code></figcaption>
        </figure>
        <figure>
          <img src="aether-mark-03-orbit.svg" alt="Aether mark 03" />
          <figcaption><span>03 Orbit</span><code>second brain cue</code></figcaption>
        </figure>
        <figure>
          <img src="aether-mark-04-gate.svg" alt="Aether mark 04" />
          <figcaption><span>04 Gate</span><code>private core</code></figcaption>
        </figure>
        <figure>
          <img src="aether-mark-05-monoline.svg" alt="Aether mark 05" />
          <figcaption><span>05 Monoline</span><code>best monochrome</code></figcaption>
        </figure>
        <figure>
          <img src="aether-mark-06-cutout.svg" alt="Aether mark 06" />
          <figcaption><span>06 Cutout</span><code>strongest icon block</code></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
